name: Thailand Apple inventory check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Query Thailand stores
        run: node cloud/monitor.mjs
      - name: Publish latest result
        uses: actions/upload-artifact@v4
        with:
          name: thailand-inventory-latest
          path: cloud/latest.json
          retention-days: 7
